<!DOCTYPE HTML>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Update in progress</title>
	<script src="/theme.js"></script>
	<link rel="stylesheet" href="/style.css">
	<script src="/i18n.js"></script>
	<script src="/main.js"></script>
	<script>
		function init() {
			appInit('flashing');

			var finished = false;

			function pollResult() {
				if (finished)
					return;

				var xhr = new XMLHttpRequest();
				xhr.timeout = 10000;
				xhr.onload = function () {
					if (finished || xhr.status !== 200)
						return;
					var r = (xhr.responseText || '').replace(/\s+/g, '');
					if (r === 'busy')
						return;
					if (r === 'failed') {
						finished = true;
						location = '/fail.html';
						return;
					}
					if (r === 'success') {
						finished = true;
						location = '/reboot.html';
					}
				};
				xhr.open('GET', '/result');
				xhr.send();
			}

			/* Queue flash immediately; poll until NAND write finishes. */
			pollResult();
			setInterval(pollResult, 1500);
		}
	</script>
</head>

<body onload="init()" data-page="flashing">
	<div class="app">
		<aside id="sidebar" class="sidebar"></aside>
		<div class="main">
			<div id="m">
				<div class="card-main status-card">
					<div class="status-hero" aria-hidden="true">
						<svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
							<polyline points="23 4 23 10 17 10"></polyline>
							<path d="M20.5 15a9 9 0 1 1-2.1-8.3"></path>
						</svg>
					</div>
					<h1 id="title" data-i18n="flashing.title.in_progress">UPDATE IN PROGRESS</h1>
					<p id="info" data-i18n-html="flashing.info.in_progress">
						Your file was successfully uploaded! Update is in progress, please wait.<br>
						Update time depends on image size and may take up to a few minutes.
					</p>
					<div class="status-feedback">
						<div id="l"></div>
						<p id="flashing_status" class="console-status"></p>
					</div>
					<div id="reboot_actions" style="display: none;">
						<button class="button" id="reboot_btn" data-i18n="flashing.action.reboot">Reboot now</button>
					</div>
				</div>
			</div>
			<div id="version"></div>
		</div>
	</div>
</body>

</html>
